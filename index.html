<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome!</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            background-color: #212830;
        }

        h1 {
            color: #F0F6FC;
            text-align: center;
            font-size: 72px;
            font-family: 'mono', sans-serif;
            text-align: left;
            margin-left: 100px;
        }

        a {
            text-decoration: none;
            color: white;
            margin-right: 20px;
            background-color: #262C36;
            max-width: 200px;
            justify-content: center;
            border-radius: 5px;
            padding: 8px 8px;
            min-width: 8px;
            text-align: center;
            color: #F0F6FC;
            font-size: 16px;
            font-weight: 550;
            text-decoration: none;
            border: 0.5px solid #F0F6FC;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .logo {
            padding: 5px 7px;
            transform: rotate(45deg);
        }

        a:hover {
            background-color: #2F3742;
            border-color: #F0F6FC;
            color: #F0F6FC;
        }

        a:active {
            background-color: #3D444D;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            display: flex;
            background-color: #262C36;
            max-width: 200px;
            justify-content: center;
            border-radius: 5px;
            padding: 15px 30px;
            min-width: 120px;
            text-align: center;
            color: #F0F6FC;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border: 0.5px solid #F0F6FC;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #2F3742;
            border-color: #F0F6FC;
            color: #F0F6FC;
        }

        .btn:active {
            background-color: #3D444D;
        }
        .cursor {
            display: inline-block;
            width: 0.62em;
            height: 0.14em;
            background: #F0F6FC;
            vertical-align: middle;
            margin-bottom: -0.5em;
            margin-left: 2px;
            animation: blink 1s step-end infinite;
        }

        .navbar {
            position: fixed;     /* 固定定位 */
            top: 0;              /* 贴在顶部 */
            left: 0;
            right: 0;
            background-color: #151B23;
            height: 64px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            z-index: 100;
            justify-content: space-between;
            border-bottom: 0.5px solid #B7BDC8;
            white-space: nowrap;      /* 防止换行 */
            flex-wrap: nowrap;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @font-face {
            font-family: 'mono';
            src: url('fonts/jetbrainsmono.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        /* 鼠标悬停时加速/变色/变方向 */
        .spin:hover {
            display: inline-block;
            animation: spin 0.5s linear infinite;  /* 加速！ */
            filter: brightness(1.2);  /* 变亮 */
            animation-direction: reverse;
        }

        .blinking-emoji {
            display: inline-block;
            animation: blink 1s step-end infinite;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div style="text-align: left;">
            <a href="/">
                <img src="favicon.ico" width="24" height="24"
                    class="spin"
                    style="transition: transform 0.5s; vertical-align: -5px;">
                <span class="spin">PyPizza</span>
            </a>
        </div>

        <div style="text-align: right;">
            <a href="https://github.com/dev-xiaome/pypizza"><span class="spin">Github</span></a>
        </div>
    </div>

    <div style="margin-top: 150px;"></div>
    <h1 id="text"></h1>
    <script>
        const lines = ["Python项目管理器:", "PyPizza"];
        const el = document.getElementById('text');
        let lineIndex = 0;
        let charIndex = 0;

        const CHAR_DELAY = 150;
        const LINE_DELAY = 300;

        function type() {
            if (lineIndex >= lines.length) {
                el.innerHTML = lines.join('<br>') + '<span class="cursor"></span>';
                return;
            }

            const line = lines[lineIndex];

            let text = '';
            for (let i = 0; i < lineIndex; i++) {
                text += lines[i] + '<br>';
            }

            text += line.substring(0, charIndex);

            el.innerHTML = text + '<span class="cursor"></span>';

            if (charIndex < line.length) {
                charIndex++;
                setTimeout(type, CHAR_DELAY);
            } else {
                lineIndex++;
                charIndex = 0;
                if (lineIndex < lines.length) {
                    setTimeout(type, LINE_DELAY);
                } else {
                    setTimeout(() => {
                        el.innerHTML = lines.join('<br>') + '<span class="cursor"></span>';
                    }, CHAR_DELAY);
                }
            }
        }

        el.innerHTML = '<span class="cursor"></span>';
        type();
    </script>
    <div style="margin-top: 100px;"></div>
</body>
</html>
