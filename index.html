<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome!</title>
    <style>
        body {
            background-color: #EEEEEE;
        }
        h1 {
            color: #222222;
            text-align: center;
        }
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn {
            display: flex;
            background-color: #5ab8ff;
            max-width: 200px;
            justify-content: center;
            border-radius: 15px;
            padding: 15px 30px;
            min-width: 120px;
            text-align: center;
            color: #222222;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border: 2px solid #111111;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #7ec7ff;
            border-color: #111111;
            transform: translateY(-3px);
            color: #111111;
        }
        .btn:active {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div style="margin-top: 100px;"></div>
    <h1>欢迎来到我的主页!</h1>
    <div style="margin-top: 50px;"></div>
    <div class="center">
        <a class="btn" href="https://xiaome-space.github.io/ModernAssembly">ModernAssembly项目</a>
    </div>
</body>
</html>
